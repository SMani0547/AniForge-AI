<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">AniForge AI — Your art. In motion.</title>
  <desc id="desc">An off-white headline on charcoal, with three continuous red meteor trails. A brief entrance animation settles into a still composition.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101214"/>
      <stop offset="1" stop-color="#181a1c"/>
    </linearGradient>
    <linearGradient id="meteor" gradientUnits="userSpaceOnUse" x1="690" y1="220" x2="1160" y2="170">
      <stop stop-color="#ff343e" stop-opacity="0"/>
      <stop offset=".44" stop-color="#ff343e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff343e"/>
    </linearGradient>
    <radialGradient id="atmosphere">
      <stop stop-color="#ff343e" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ff343e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel"><rect width="1200" height="380" rx="12"/></clipPath>
  </defs>
  <style>
    .intro { animation: reveal 1.2s ease-out 1 both; }
    .motion { animation: arrive 3.6s cubic-bezier(.16,1,.3,1) 1 both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes arrive { from { opacity: 0; transform: translate(-32px,16px); } to { opacity: 1; transform: translate(0,0); } }
    @media (prefers-reduced-motion: reduce) { .intro,.motion { animation: none; } }
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="380" fill="url(#background)"/>
    <ellipse cx="1020" cy="210" rx="350" ry="290" fill="url(#atmosphere)"/>
    <g fill="none" stroke="#f3f2ef" stroke-opacity=".055">
      <path d="M632 0v380M1199 0v380M0 319h1200"/>
      <ellipse cx="1000" cy="197" rx="204" ry="115" transform="rotate(-30 1000 197)"/>
      <ellipse cx="1000" cy="197" rx="256" ry="145" transform="rotate(-30 1000 197)"/>
    </g>
    <g class="intro" font-family="Arial,Helvetica,sans-serif">
      <path d="M52 52h25" stroke="#f2552c" stroke-width="3"/>
      <text x="92" y="56" fill="#b7b9bd" font-size="11" letter-spacing="2.5">AN ANIME CREATION STUDIO</text>
      <text x="48" y="154" fill="#f3f2ef" font-size="76" font-weight="800" letter-spacing="-4">Your art.</text>
      <text x="48" y="229" fill="#f3f2ef" font-size="76" font-weight="800" font-style="italic" letter-spacing="-4">In motion.</text>
      <text x="53" y="274" fill="#b7b9bd" font-size="16">Draw it. Direct it. Make it yours.</text>
    </g>
    <g class="motion" fill="url(#meteor)">
      <path d="M668 304C865 208 1009 138 1091 117C1100 120 1104 127 1097 132C1009 182 872 246 668 304Z"/>
      <path d="M769 52C887 75 1019 153 1165 255C1167 259 1166 265 1160 264C1011 178 905 105 769 52Z" opacity=".8"/>
      <path d="M780 344C937 324 1043 275 1167 217C1171 216 1176 218 1175 223C1071 291 933 337 780 344Z" opacity=".6"/>
      <path d="M909 215l19-10-12 9zM941 196l17-9-10 8zM1017 159l11-5-6 5zM1100 293l11-7-6 6zM985 141l11 6-7-2z" opacity=".65"/>
    </g>
    <g font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.8">
      <text x="53" y="354" fill="#b7b9bd">ORIGINAL ART / EDITABLE SCENES / NEW POSSIBILITIES</text>
      <text x="1147" y="354" fill="#b7b9bd" text-anchor="end">POWERED BY GOOGLE AI</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="379" rx="11.5" fill="none" stroke="#f3f2ef" stroke-opacity=".12"/>
  </g>
</svg>
