<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">AniForge AI — Your next adventure starts with a sketch</title>
  <desc id="desc">An original copper-sailed ship beneath a violet moon, beside the AniForge title. Stars and waves animate briefly, then rest.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111321"/><stop offset="1" stop-color="#272341"/></linearGradient>
    <linearGradient id="sail" x2="1" y2="1"><stop stop-color="#ffd49b"/><stop offset="1" stop-color="#da8266"/></linearGradient>
    <linearGradient id="moon" x2="0" y2="1"><stop stop-color="#c6bdff"/><stop offset="1" stop-color="#7563b4"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#bfb8ff" stroke-opacity=".05"/></pattern>
  </defs>
  <style>
    .ship { animation: drift 4s ease-in-out 1; transform-origin: 935px 246px; }
    .stars { animation: shimmer 4s ease-in-out 1; }
    .wave { animation: tide 4s ease-in-out 1; }
    @keyframes drift { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(-2deg); } }
    @keyframes shimmer { 0%,100% { opacity: .8; } 50% { opacity: .3; } }
    @keyframes tide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(12px); } }
    @media (prefers-reduced-motion: reduce) { .ship,.stars,.wave { animation: none; } }
  </style>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <rect x="24" y="24" width="1152" height="332" rx="16" fill="none" stroke="#b9afff" stroke-opacity=".18"/>
  <circle cx="1000" cy="140" r="96" fill="#a89ae2" opacity=".05"/>
  <circle cx="1000" cy="140" r="73" fill="url(#moon)" opacity=".8"/>
  <g class="stars" fill="#e4dcff" opacity=".8"><circle cx="805" cy="75" r="2"/><circle cx="1120" cy="94" r="2"/><circle cx="750" cy="195" r="2"/><circle cx="1080" cy="233" r="2"/><path d="M855 116v14m-7-7h14M1095 167v12m-6-6h12" stroke="#e4dcff"/></g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="65" y="65" width="199" height="30" rx="15" fill="#bcb2ff" fill-opacity=".12" stroke="#bcb2ff" stroke-opacity=".3"/>
    <text x="82" y="85" fill="#d5cdff" font-size="12" letter-spacing="2">THE CREATOR'S VOYAGE</text>
    <text x="62" y="179" fill="#f7f4ff" font-size="76" font-weight="750" letter-spacing="-4">AniForge<tspan fill="#bdb2ff"> AI</tspan></text>
    <text x="66" y="226" fill="#d7d3e7" font-size="23">Draw it. Animate it. Make it yours.</text>
    <path d="M66 254h58" stroke="#efb887" stroke-width="3" stroke-linecap="round"/>
    <text x="66" y="290" fill="#a8a5bd" font-size="14" letter-spacing="2">ORIGINAL ART / EDITABLE SCENES / NEW HORIZONS</text>
  </g>
  <g class="ship">
    <path d="M833 249h212l-38 39H869z" fill="#503b52" stroke="#edb08e" stroke-width="2"/>
    <path d="M853 261h169M873 273h136" stroke="#b98984" stroke-opacity=".55"/>
    <path d="M935 88v160" stroke="#ecc7a5" stroke-width="4"/>
    <path d="M925 116l-77 115h77z" fill="url(#sail)"/>
    <path d="M946 120q68 36 85 110h-85z" fill="#c2b6f1"/>
    <path d="M946 120q34 57 85 110M925 116l-34 115" fill="none" stroke="#302946" stroke-opacity=".25"/>
    <path d="M936 91l37 10-37 12z" fill="#f2bc83"/>
    <path d="M977 163l8 16-8 16-8-16z" fill="#514578"/>
  </g>
  <g class="wave" fill="none" stroke="#aba1db" stroke-opacity=".45" stroke-linecap="round"><path d="M786 302q40-15 80 0t80 0 80 0 80 0"/><path d="M842 321q32-10 64 0t64 0 64 0"/></g>
  <text x="1096" y="343" fill="#9d93ba" font-size="10" font-family="monospace" text-anchor="end">CHAPTER 01 / SET SAIL</text>
</svg>
